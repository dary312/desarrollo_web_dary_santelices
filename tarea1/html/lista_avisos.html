<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Listado de avisos</title>
        <link rel="stylesheet" href="../css/lista_avisos.css">
    </head>
    <body>
        <h1>Listado de avisos</h1>\
        <div id="listado">
            <table>
            <thead>
                <tr>
                <th>Fecha publicacion</th>
                <th>Fecha entrega</th>
                <th>Comuna</th>
                <th>Sector</th>
                <th>Cantidad tipo edad</th>
                <th>Nombre contacto</th>
                <th>Total Fotos</th>
                </tr>
            </thead>
            <tbody id="tabla_avisos">
            </tbody>
            </table>
        </div>

        <div id="detalle" style="display:none;">
            <h2>Detalle del aviso</h2>
            <p><strong>Fecha de publicacion:</strong> <span id="detalle_fecha_publicacion"></span></p>
            <p><strong>Region:</strong> <span id="detalle_region"></span></p>
            <p><strong>Comuna:</strong> <span id="detalle_comuna"></span></p>
            <p><strong>Sector:</strong> <span id="detalle_sector"></span></p>
            <p><strong>Nombre contacto:</strong> <span id="detalle_nombre"></span></p>
            <p><strong>Email:</strong> <span id="detalle_email"></span></p>
            <p><strong>Telefono:</strong> <span id="detalle_telefono"></span></p>
            <p><strong>Medio de contacto:</strong> <span id="detalle_contacto"></span></p>
            <p><strong>Animales:</strong> <span id="detalle_animales"></span></p>
            <p><strong>Fecha entrega:</strong> <span id="detalle_fecha"></span></p>
            <p><strong>Descripcion:</strong> <span id="detalle_descripcion"></span></p>

            <div id="detalle_fotos"></div>
            <br>
            <button onclick="mostrarListado()">Volver al listado</button>
        </div>
        <button id="portada_button" class="portada_button">Volver a la portada</button>  
        <script src="../js/lista_avisos.js"></script>
    </body>
</html>
