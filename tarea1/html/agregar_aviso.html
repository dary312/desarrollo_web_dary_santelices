<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Mensaje pestaña</title>
        <link rel="stylesheet" href="../css/agregar_aviso.css">
    </head>
    <body>
        <h1>Agrega tu aviso:</h1>
        <div>
            <form>
                <h2>¿Dónde?:</h2>
                <div>
                    <label for="region">Region:</label>
                    <select id="region" name="region" required>
                        <option value="">Seleccione una region</option>
                    </select>
                    <br>
                    <label for="comuna">Comuna:</label>
                    <select id="comuna" name="comuna" required>
                        <option value="">Seleccione una comuna</option>
                    </select>
                    <br>
                    <label>Sector</label>
                    <input id="sector" name="sector" type="text">
                </div>
                <h2>¿Contacto de esta publicación?:</h2>
                <div>
                    <label for="nombre">Nombre:</label>
                    <input id="nombre" type="text" minlength="3" maxlength="200" required>
                    <br>
                    <label for="email">Email:</label>
                    <input id="email" type="email" maxlength="100" required>
                    <br>
                    <label for="telefono">Telefono:</label>
                    <input id="telefono" name="telefono" type="tel" pattern="^\+\d{3}\.\d{8}$" placeholder="Formato: +NNN.NNNNNNNN">
                    <br> 
                    <div id="contactos">   
                        <label for="red_social">Contactar por:</label>
                        <select id="red_social" name="red_social" >
                            <option value="">Seleccione una red social</option>
                            <option value="whatsapp">Whatsapp</option>
                            <option value="telegram">Telegram</option>
                            <option value="x">X</option>
                            <option value="instagram">Instagram</option>
                            <option value="tiktok">Tiktok</option>
                            <option value="otra">Otra</option>
                        </select>
                        <input id="red_social_input" type="text" style="display: none;" minlength="4" maxlength="50">
                        <br>
                        <label for="red_social_2" style="display: none;">Otro medio de contacto:</label>
                        <select id="red_social_2" name="red_social_2" style="display: none;">
                            <option value="">Seleccione una red social</option>
                            <option value="whatsapp">Whatsapp</option>
                            <option value="telegram">Telegram</option>
                            <option value="x">X</option>
                            <option value="instagram">Instagram</option>
                            <option value="tiktok">Tiktok</option>
                            <option value="otra">Otra</option>
                        </select>
                        <input id="red_social_input_2" type="text" style="display: none;" minlength="4" maxlength="50">
                        <br>
                        <label for="red_social_3" style="display: none;">Otro medio de contacto:</label>
                        <select id="red_social_3" name="red_social_3" style="display: none;">
                            <option value="">Seleccione una red social</option>
                            <option value="whatsapp">Whatsapp</option>
                            <option value="telegram">Telegram</option>
                            <option value="x">X</option>
                            <option value="instagram">Instagram</option>
                            <option value="tiktok">Tiktok</option>
                            <option value="otra">Otra</option>
                        </select>
                        <input id="red_social_input_3" type="text" style="display: none;" minlength="4" maxlength="50">
                        <br>
                        <label for="red_social_4" style="display: none;">Otro medio de contacto:</label>
                        <select id="red_social_4" name="red_social_4" style="display: none;">
                            <option value="">Seleccione una red social</option>
                            <option value="whatsapp">Whatsapp</option>
                            <option value="telegram">Telegram</option>
                            <option value="x">X</option>
                            <option value="instagram">Instagram</option>
                            <option value="tiktok">Tiktok</option>
                            <option value="otra">Otra</option>
                        </select>
                        <input id="red_social_input_4" type="text" style="display: none;" minlength="4" maxlength="50">
                        <br>
                        <label for="red_social_5" style="display: none;">Otro medio de contacto:</label>
                        <select id="red_social_5" name="red_social_5" style="display: none;">
                            <option value="">Seleccione una red social</option>
                            <option value="whatsapp">Whatsapp</option>
                            <option value="telegram">Telegram</option>
                            <option value="x">X</option>
                            <option value="instagram">Instagram</option>
                            <option value="tiktok">Tiktok</option>
                            <option value="otra">Otra</option>
                        </select>
                        <input id="red_social_input_5" type="text" style="display: none;" minlength="4" maxlength="50">
                    </div>   
                </div>
                <h2>¿Qué mascota ofrece en adopción?:</h2>
                <div>
                    <label>Tipo:</label>
                    <div>
                        <input type="radio" id="perro" name="tipo" value="perro">
                        <label for="perro" class="radio_button">Perro</label>
                        <br>
                        <input type="radio" id="gato" name="tipo" value="gato">
                        <label for="gato" class="radio_button">Gato</label>
                    </div>
                    <br>
                    <label for="cantidad">Cantidad:</label>
                    <input id="cantidad" type="number" required min="1">
                    <br>
                    <label for="edad">Edad:</label>
                    <input id="edad" type="number" required min="1">
                    <br>
                    <label>Unidad medidad edad:</label>
                    <div>
                        <input type="radio" id="meses" name="unidad" value="meses">
                        <label for="meses" class="radio_button">Meses</label>
                        <br>
                        <input type="radio" id="años" name="unidad" value="años">
                        <label for="años" class="radio_button">Años</label>
                    </div>
                    <br>
                    <label for="fecha_entrega">Fecha disponible para entrega:</label>
                    <input id="fecha_entrega" type="datetime-local" required>
                    <br>
                    <label>Descripción:</label><br>
                    <textarea cols="50" rows="10" placeholder="Agrega una descripcion..."></textarea>        
                    <br>
                    
                    <label>Foto(s):</label>
                    <div id="contenedor_fotos">
                        <input type="file" accept="image/*" required id="foto">
                    </div>
                    <button type="button" id="agregar_foto">Agregar otra foto</button>
                </div>
                <button type="button" id="agregar_aviso"> Agregar este aviso de adopción</button>
            </form>
            <button id="portada_button" class="portada_button">Volver a la portada</button>          
        </div>
        <script src="../js/selector.js"></script>
        <script src="../js/otra_foto.js"></script>
        <script src="../js/validador.js"></script>
        <script src="../js/agregar_aviso.js"></script>
    </body>
    
</html>
